name: Update GitHub Contributor Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "README.template.md"
      - "requirements.txt"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

concurrency:
  group: contributor-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git
          pip install -r requirements.txt

      - name: Collect statistics
        env:
          GITHUB_ORG: TheTuringClubJU
          GITHUB_TOKEN: ${{ secrets.ORG_STATS_TOKEN }}
        run: python scripts/collect_stats.py

      - name: Commit generated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/README.md data/stats.json

          if git diff --cached --quiet; then
            echo "No statistics changed."
            exit 0
          fi

          git commit -m "chore: update contributor statistics [skip ci]"
          git push